<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portal: The Flash Version</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#0d1117; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; }
  #bar { display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:#161b22; border-bottom:1px solid #30363d; color:#e6edf3; }
  #bar h1 { font-size:1rem; font-weight:600; }
  #bar .tag { font-size:.72rem; color:#3fb950; border:1px solid #3fb950;
    border-radius:10px; padding:2px 8px; white-space:nowrap; }
  #bar .hint { margin-left:auto; font-size:.75rem; color:#8b949e; }
  #bar a.games { font-size:.8rem; color:#58a6ff; text-decoration:none;
    border:1px solid #58a6ff; border-radius:10px; padding:3px 10px; white-space:nowrap; }
  #stage { flex:1; position:relative; background:#000; }
  #stage ruffle-player { position:absolute; inset:0; width:100%; height:100%; }
  #loading { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:#8b949e; font-size:.9rem; background:#000; z-index:5; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <h1>Portal: The Flash Version</h1>
    <span class="tag">Ruffle • offline-ready</span>
    <a class="games" href="games.html">🎮 32 browser games</a>
    <span class="hint">40+ think-with-portals levels in 2D — Q/E or click to shoot portals</span>
  </div>
  <div id="stage">
    <div id="loading">Loading game…</div>
  </div>
</div>
<script src="ruffle.js"></script>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.addEventListener("DOMContentLoaded", async () => {
    const loading = document.getElementById("loading");
    try {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("stage").appendChild(player);
      const res = await fetch("portal.swf");
      if (!res.ok) throw new Error("missing portal.swf");
      const url = URL.createObjectURL(await res.blob());
      await player.load(url);
      loading.remove();
    } catch (e) {
      loading.textContent = "Could not load the game file. " + e;
    }
  });
</script>
</body>
</html>
